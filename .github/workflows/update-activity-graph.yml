name: Update Contribution Activity Graph

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/activity-graph.svg'
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Activity Graph SVG
        run: python scripts/generate_graph.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --staged --quiet; then
            echo "No changes in activity graph"
          else
            git commit -m "chore: auto-update contribution activity graph [skip ci]"
            git push
          fi
